name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ObjPoser.exe (.NET Framework 4.8)
        run: msbuild src/ObjPoser.csproj /p:Configuration=Release /verbosity:minimal

      - name: Self-test (core library)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:selftest.exe tests\CoreSelfTest.cs src\Core.cs src\Skeleton.cs src\Pose.cs src\Skinner.cs src\Export.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\selftest.exe samples\sample_tpose.obj
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src\bin\Release\ObjPoser.exe dist\
          Copy-Item README.md, README.ar.md, LICENSE, THIRD_PARTY_NOTICES.md dist\
          Copy-Item samples dist\samples -Recurse
          Compress-Archive -Path dist\* -DestinationPath ObjPoser-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObjPoser-windows
          path: ObjPoser-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ObjPoser-windows

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ObjPoser-windows.zip
          generate_release_notes: true
